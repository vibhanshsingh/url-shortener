[pytest]
# auto mode: any `async def test_...` function is automatically treated
# as an asyncio test, without needing @pytest.mark.asyncio on every
# single one. Without this, pytest silently skips async test functions
# (they just never actually run their body) — a genuinely easy trap to
# fall into and not notice, since the test suite still reports "passed."
asyncio_mode = auto

# Without this, `from app.services.encoding import encode` inside the
# test files fails with ModuleNotFoundError the moment pytest is run
# from anywhere other than exactly the right working directory —
# pythonpath = . tells pytest to add the project root to sys.path
# itself, so imports resolve regardless of how/where pytest is invoked
# (directly, via an IDE test runner, from CI, etc).
pythonpath = .

# Explicit rather than relying on pytest's default discovery walking
# the whole project tree — faster collection, and it means a stray
# script sitting outside tests/ can never accidentally get picked up
# and run as a test.
testpaths = tests
