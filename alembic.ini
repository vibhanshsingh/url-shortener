[alembic]
script_location = migrations
prepend_sys_path = .

# We deliberately do NOT hardcode sqlalchemy.url here — env.py pulls it
# from app.core.config.settings instead, so the same migration files
# work against local Docker, CI, and prod without editing this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
