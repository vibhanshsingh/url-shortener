# Plain-language version: this file tells Prometheus "go check these
# addresses every 15 seconds and pull in whatever metrics they're
# currently reporting." Each entry under `static_configs` is one
# process exposing a /metrics endpoint — we have two, because the API
# and the consumer are two separate processes (see Milestone 8), each
# with their own metrics.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "url_shortener_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "url_shortener_consumer"
    static_configs:
      - targets: ["consumer:8001"]
    metrics_path: /metrics
